    <!-- Structured Data - FAQPage for common questions -->
    <script type="application/ld+json" id="faq-jsonld">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is ODS?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ODS (Ordering Dashboard Solution) is an all-in-one restaurant management platform. It combines QR-code ordering with pay-first Stripe checkout, beautiful menu design templates, built-in AI (menu videos, food photography, menu and supplier-invoice capture), inventory and cost management, loyalty and CRM, real-time analytics, and the free ODS Print desktop app for kitchen and receipt printing."
          }
        },
        {
          "@type": "Question",
          "name": "How much does ODS cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ODS is free for venues with 500 or more orders per month — you only pay a small per-order service fee that is added to the guest's total. For venues under 500 orders per month, the ODS Price Center sets one fair, fixed monthly price. All features are included in every plan, and there is a 7-day free trial with no credit card required."
          }
        },
        {
          "@type": "Question",
          "name": "How do customers pay with ODS pay-first?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "With pay-first, guests pay by card via Stripe the moment they order, before the order reaches the kitchen. Payments settle directly to the restaurant's own Stripe account with 0% commission charged to the restaurant. ODS collects only a small per-order service fee (from €0.20 up to €1.00 by ticket size) that is added to the guest's total."
          }
        },
        {
          "@type": "Question",
          "name": "Does ODS have AI features?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. ODS includes shipped AI tools: AI menu-video reels generated from a dish photo, AI food photography for dishes, categories and ingredients, AI menu scanning that digitizes a paper menu, AI recipe composition from in-stock ingredients, and AI supplier-invoice capture that extracts line items, VAT and totals from a photo."
          }
        },
        {
          "@type": "Question",
          "name": "Does ODS work with receipt and kitchen printers?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, through the free ODS Print app for Windows. It connects your thermal printers to ODS and prints every incoming order automatically, routing price-less kitchen tickets and priced counter receipts to the right station. It supports network (LAN, port 9100), USB and any installed Windows printer."
          }
        },
        {
          "@type": "Question",
          "name": "What languages and countries does ODS support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The ODS website and dashboard are available in English, French and German, and printed tickets support 7 languages including Arabic (right-to-left). Pay-first works in every Stripe-supported country and currency, with the service fee shown in the guest's local currency."
          }
        }
      ]
    }
    </script>
